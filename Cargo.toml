[package]
name = "dynamic-diagram"
version = "0.2.0"
edition = "2021"

[dependencies]
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
png = "0.17"
libc = "0.2"
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }

[profile.release]
opt-level = 3
