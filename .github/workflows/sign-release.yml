# Signs every release asset with minisign and uploads the .sig files.
# Key: signing.key (repo-local, gitignored) / signing.pub (committed).
# The -l format is the ecosystem-standard minisign signature (pure Ed25519)
# understood by cargo-binstall, rsign and every minisign release.
name: sign-release

# NOTE: cargo-dist creates the GitHub release with the workflow's built-in
# GITHUB_TOKEN, and GitHub never lets GITHUB_TOKEN-created events trigger
# more workflows (recursion guard). `release: published` alone therefore
# never fires — workflow_run on the Release workflow completing is the
# documented workaround. workflow_dispatch covers retroactive signing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to sign (e.g. v0.2.0)"
        required: true
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  sign:
    # skip non-tag completions of the Release workflow (e.g. PR plan runs)
    if: github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Install minisign 0.12
        run: |
          curl -sL https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz | tar xz
          sudo install -m755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
      - name: Sign release assets
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          printf '%s' "$MINISIGN_PRIVATE_KEY" > "$RUNNER_TEMP/signing.key"
          tag="$TAG"
          mkdir assets && cd assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            -p '*.tar.gz' -p '*.zip' -p '*.msi' -p 'sha256.sum' \
            -p '*installer.sh' -p '*installer.ps1'
          for f in *; do
            minisign -S -l -W -s "$RUNNER_TEMP/signing.key" -x "$f.sig" -m "$f" \
              -c "signature for $f" -t "trusted comment: dynamic-diagram $tag $f"
            rm "$f"
          done
          gh release upload "$tag" ./*.sig --repo "$GITHUB_REPOSITORY" --clobber
